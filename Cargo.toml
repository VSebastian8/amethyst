[package]
name = "amethyst_geode"
version = "1.3.0"
edition = "2021"
authors = ["VSebastian8"]
license = "MPL-2.0"
description = "Turing Machine Programming Language Interpreter"
homepage = "https://github.com/VSebastian8/amethyst"
repository = "https://github.com/VSebastian8/amethyst"
keywords = ["cli", "programming", "language", "turing", "automata"]
exclude = ["/extensions", "/code", "/tests", "/config"]
# [[bin]]
# name = "geode"
# path = "src/bin/geode.rs"
[lib]
name = "amethyst"
path = "src/lib.rs"
[dev-dependencies]
serial_test = "0.5"
ctor = "0.1"
[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
lsp-server = "0.7"
lsp-types = "0.95"
serde = "1.0.229"
serde_json = "1"
colored = "3.0.0"
cranelift-codegen = "0.105"
cranelift-frontend = "0.105"
target-lexicon = "0.12"
indexmap = "=2.2.6"
thiserror = "2.0.20"
[profile.release]
opt-level = 1
